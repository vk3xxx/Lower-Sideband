name: MacSideband
options:
  bundleIdPrefix: io.unsigned.sideband
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: DLV44BUBE7
packages:
  Ed25519:
    url: https://github.com/AndrewBarba/ed25519.git
    from: 1.1.0
targets:
  ReticulumKit:
    type: framework
    platform: iOS
    sources:
      - path: Sources/ReticulumKit
    dependencies:
      - package: Ed25519
      - sdk: libbz2.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supes.MacSideband.ReticulumKit
        PRODUCT_MODULE_NAME: ReticulumKit
        MARKETING_VERSION: 1.3.58
        CURRENT_PROJECT_VERSION: 96
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  ReticulumKitMac:
    type: framework
    platform: macOS
    sources:
      - path: Sources/ReticulumKit
    dependencies:
      - package: Ed25519
      - sdk: libbz2.tbd
    settings:
      base:
        PRODUCT_NAME: ReticulumKit
        PRODUCT_MODULE_NAME: ReticulumKit
        PRODUCT_BUNDLE_IDENTIFIER: com.supes.MacSideband.ReticulumKit.mac
        MARKETING_VERSION: 1.3.58
        CURRENT_PROJECT_VERSION: 96
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  SidebandCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/SidebandCore
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: ReticulumKit
      - package: Ed25519
      - framework: Vendor/Codec2.xcframework
      - sdk: libsqlite3.tbd
      - sdk: libbz2.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supes.MacSideband.Core
        MARKETING_VERSION: 1.3.58
        CURRENT_PROJECT_VERSION: 96
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  SidebandIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/SidebandMac
      - path: Support/SidebandAssets.xcassets
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: SidebandCore
      - target: ReticulumKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supes.MacSideband
        PRODUCT_NAME: Sideband
        MARKETING_VERSION: 1.3.58
        CURRENT_PROJECT_VERSION: 96
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Support/Sideband-iOS-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Support/Sideband-iOS.entitlements
  SidebandCoreMac:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SidebandCore
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: ReticulumKitMac
      - package: Ed25519
      - framework: Vendor/Codec2.xcframework
      - sdk: libsqlite3.tbd
      - sdk: libbz2.tbd
    settings:
      base:
        PRODUCT_NAME: SidebandCore
        PRODUCT_MODULE_NAME: SidebandCore
        PRODUCT_BUNDLE_IDENTIFIER: com.supes.MacSideband.Core.mac
        MARKETING_VERSION: 1.3.58
        CURRENT_PROJECT_VERSION: 96
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  SidebandMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/SidebandMac
      - path: Support/SidebandAssets.xcassets
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: SidebandCoreMac
      - target: ReticulumKitMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supes.MacSideband
        PRODUCT_NAME: Lower Sideband
        MARKETING_VERSION: 1.3.58
        CURRENT_PROJECT_VERSION: 96
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Support/Sideband-macOS-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Support/Sideband.entitlements
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  SidebandIOS:
    build:
      targets:
        SidebandIOS: all
    run:
      config: Debug
    archive:
      config: Release
  SidebandMac:
    build:
      targets:
        SidebandMac: all
    run:
      config: Debug
    archive:
      config: Release
