name: Apple builds

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-apple-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-and-ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Toolchain
        run: xcodebuild -version
      - name: Repository consistency
        run: Scripts/check-repository.sh
      - name: Swift tests
        run: swift test
      - name: macOS application build
        run: >-
          xcodebuild -project MacSideband.xcodeproj
          -scheme SidebandMac
          -destination 'platform=macOS'
          -derivedDataPath .build/macos-ci
          CODE_SIGNING_ALLOWED=NO build
      - name: iOS device build
        run: >-
          xcodebuild -project MacSideband.xcodeproj
          -scheme SidebandIOS
          -destination 'generic/platform=iOS'
          -derivedDataPath .build/ios-ci
          CODE_SIGNING_ALLOWED=NO build
